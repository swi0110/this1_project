<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>this1_project</title>
  <meta name="description" content="this1_project에 담긴 웹 프로젝트 목록">
  <style>
    :root {
      --bg:          #ffffff;
      --bg-hover:    #f5f5f5;
      --line:        #e5e5e5;
      --line-strong: #171717;

      --ink:         #171717;
      --ink-muted:   #525252;
      --ink-faint:   #a3a3a3;

      color-scheme: light;

      --sans: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
              system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    /* ══ 머리말 ══════════════════════════════════════════════════════════ */

    header {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line-strong);
    }

    h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -.01em;
      color: var(--ink);
    }

    .tagline {
      margin: 8px 0 0;
      font-size: 14px;
      color: var(--ink-muted);
    }

    /* ══ 목록 ════════════════════════════════════════════════════════════ */

    .list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .list > li { border-bottom: 1px solid var(--line); }

    .row {
      display: grid;
      grid-template-columns: 44px 1fr 20px;
      align-items: baseline;
      gap: 0 4px;
      padding: 24px 8px 24px 0;
      text-decoration: none;
      color: inherit;
      transition: background-color .12s ease;
    }
    .row:hover { background: var(--bg-hover); }
    .row:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: -2px;
      background: var(--bg-hover);
    }

    .num {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-faint);
      font-variant-numeric: tabular-nums;
    }

    .title {
      display: block;
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .subtitle {
      display: block;
      margin: 2px 0 0;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: .02em;
      color: var(--ink-faint);
    }

    .desc {
      display: block;
      margin: 10px 0 0;
      font-size: 14px;
      color: var(--ink-muted);
      max-width: 52ch;
    }

    .meta {
      display: block;
      margin: 12px 0 0;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .02em;
      color: var(--ink-faint);
    }

    .arrow {
      justify-self: end;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-faint);
      transition: transform .12s ease, color .12s ease;
    }
    .row:hover .arrow,
    .row:focus-visible .arrow {
      color: var(--ink);
      transform: translateX(3px);
    }

    /* ══ 꼬리말 ══════════════════════════════════════════════════════════ */

    footer {
      margin-top: 48px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-faint);
    }
    footer a {
      color: var(--ink-muted);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
    }
    footer a:hover {
      color: var(--ink);
      border-bottom-color: var(--ink);
    }

    @media (max-width: 560px) {
      .wrap { padding: 48px 20px 64px; }
      .row { grid-template-columns: 32px 1fr 16px; padding: 20px 4px 20px 0; }
      .desc { max-width: none; }
    }
  </style>
</head>
<body>

  <div class="wrap">

    <header>
      <h1>this1_project</h1>
      <p class="tagline">빌드도 설치도 없는 정적 웹 프로젝트 모음입니다.</p>
    </header>

    <main>
      <ul class="list">

        <li>
          <a class="row" href="unit_conversion/">
            <span class="num">01</span>
            <span>
              <span class="title">메르헨 단위계 변환기</span>
              <span class="subtitle">Märchen Unit Converter</span>
              <span class="desc">
                SI · 야드파운드 · 척관법으로 표현된 값을 메르헨 단위계(mt · dt · dtt · tht)
                또는 야드파운드로 변환합니다. 길이 · 넓이 · 부피 · 무게를 지원하며
                한국어 / 영어를 전환할 수 있습니다.
              </span>
              <span class="meta">HTML · CSS · JavaScript</span>
            </span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </li>

      </ul>
    </main>

    <footer>
      <a href="https://github.com/swi0110/this1_project">github.com/swi0110/this1_project</a>
    </footer>

  </div>

</body>
</html>
